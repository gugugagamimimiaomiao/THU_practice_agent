# Apply after compose.yaml on a public VPS. Caddy obtains and renews HTTPS
# certificates automatically after DOMAIN resolves to this server.
services:
  practice-xiaoda:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - practice-xiaoda
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
