services:
  - type: web
    name: practice-xiaoda
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PRACTICE_XIAODA_ENV
        value: production
      - key: PUBLIC_DASHBOARD
        value: "false"
      - key: PRACTICE_XIAODA_DB
        value: /data/practice_xiaoda.db
      - key: SEED_DEMO_DATA
        value: "false"
      - key: XIAODA_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
    disk:
      name: practice-xiaoda-data
      mountPath: /data
      sizeGB: 1
